name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Spec checks (verify.py)
        run: python3 verify.py
      - name: Mutation tests (the checks can fail)
        run: python3 -m unittest discover -s tests -v
